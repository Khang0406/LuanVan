- name: Install K3s worker nodes
  hosts: k3s_workers
  become: true
  vars:
    master_host: "{{ groups['k3s_master'][0] }}"
    master_ip: "{{ hostvars[master_host].ansible_host | default(master_host) }}"
    k3s_token: "{{ hostvars[master_host].k3s_node_token }}"
  tasks:
    - name: Install K3s agent and join cluster
      ansible.builtin.shell: curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -
      args:
        creates: /usr/local/bin/k3s-agent
