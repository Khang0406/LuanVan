- name: Uninstall K3s from nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Uninstall K3s server if exists
      ansible.builtin.shell: /usr/local/bin/k3s-uninstall.sh
      ignore_errors: true
      when: inventory_hostname in groups.get('k3s_master', [])
    - name: Uninstall K3s agent if exists
      ansible.builtin.shell: /usr/local/bin/k3s-agent-uninstall.sh
      ignore_errors: true
      when: inventory_hostname in groups.get('k3s_workers', [])
