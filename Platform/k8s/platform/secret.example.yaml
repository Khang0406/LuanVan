apiVersion: v1
kind: Secret
metadata:
  name: platform-runtime
  namespace: platform-system
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  FLASK_SECRET_KEY: REPLACE_WITH_RANDOM_64_HEX_CHARACTERS
  PLATFORM_ADMIN_USERNAME: admin
  # Required for a fresh database and rotates legacy admin/admin123.
  PLATFORM_ADMIN_PASSWORD: REPLACE_WITH_STRONG_ADMIN_PASSWORD
  # Required only when importing a database that still contains dev/dev123.
  PLATFORM_DEV_PASSWORD: REPLACE_WITH_STRONG_DEVELOPER_PASSWORD
  # Optional SMTP production delivery. Keep these values in a Secret, never a
  # ConfigMap or tracked file.
  SMTP_HOST: smtp.example.invalid
  SMTP_PORT: "587"
  SMTP_FROM: platform@example.invalid
  SMTP_TO: operator@example.invalid
  SMTP_USERNAME: REPLACE_ME
  SMTP_PASSWORD: REPLACE_ME
  SMTP_STARTTLS: "true"
  # Optional. Registry PATs for application pipelines are entered through the
  # Platform Environment UI and stored masked/permission-restricted on the PVC.
  GRAFANA_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-builder-ssh
  namespace: platform-system
type: Opaque
stringData:
  # Never commit the populated Secret. Create it with kubectl as documented in
  # docs/cloud-deployment.md.
  id_ed25519: REPLACE_WITH_PRIVATE_KEY
  known_hosts: REPLACE_WITH_SSH_KEYSCAN_OUTPUT
