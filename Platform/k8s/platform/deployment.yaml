apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/part-of: delivery-platform
spec:
  # Phase 1 uses SQLite and in-process pipeline threads. Keep exactly one pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/part-of: delivery-platform
    spec:
      serviceAccountName: platform
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: platform
          image: docker.io/PLATFORM_ORG/delivery-platform:PHASE1_TAG
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-runtime
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: platform-data
              mountPath: /var/lib/platform
            - name: builder-ssh
              mountPath: /run/secrets/builder
              readOnly: true
      volumes:
        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data
        - name: builder-ssh
          secret:
            secretName: platform-builder-ssh
            # kubelet changes the group to fsGroup=10001; group-read is needed
            # by the non-root Platform process.
            defaultMode: 0440
