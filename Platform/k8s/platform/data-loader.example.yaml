apiVersion: v1
kind: Pod
metadata:
  name: platform-data-loader
  namespace: platform-system
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 10001
  containers:
    - name: loader
      image: busybox:1.36
      command: [sh, -c, "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: platform-data
          mountPath: /var/lib/platform
  volumes:
    - name: platform-data
      persistentVolumeClaim:
        claimName: platform-data
