<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CICT Platform UI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CP</div>
      <div><strong>CICT Platform</strong><small>UI Prototype</small></div>
    </div>
    <nav class="nav flex-column gap-1">
      <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('ui.servers') }}">Server Inventory</a>
      <a class="nav-link" href="{{ url_for('ui.clusters') }}">Kubernetes Setup</a>
      <a class="nav-link" href="{{ url_for('ui.applications') }}">Applications</a>
      <a class="nav-link" href="{{ url_for('ui.deployment_detail') }}">Deployments</a>
      <a class="nav-link" href="{{ url_for('ui.cicd') }}">CI/CD</a>
      <a class="nav-link" href="{{ url_for('ui.monitoring') }}">Monitoring</a>
      <a class="nav-link" href="{{ url_for('ui.jobs') }}">Job Logs</a>
      <a class="nav-link" href="{{ url_for('ui.audit') }}">Audit Log</a>
    </nav>
  </aside>
  <section class="main-content">
    <header class="topbar">
      <div>
        <span class="badge text-bg-primary">Demo thứ 6</span>
        <span class="text-muted ms-2">UI-only, backend để trống để bổ sung sau</span>
      </div>
      <div class="user-chip">admin / DevOps</div>
    </header>
    <main class="container-fluid py-4">
      {% block content %}{% endblock %}
    </main>
  </section>
</div>
</body>
</html>
