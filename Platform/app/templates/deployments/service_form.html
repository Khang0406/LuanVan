{% extends 'base.html' %}{% block content %}
<h1>Tạo service / microservice</h1>
<div class="card soft-card"><div class="card-body p-4"><form class="mock-form row g-3"><div class="col-md-6"><label class="form-label">Tên service</label><input class="form-control" value="web-frontend"></div><div class="col-md-6"><label class="form-label">Phương thức deploy</label><select class="form-select"><option>Docker image</option><option>GitHub repository</option></select></div><div class="col-12"><label class="form-label">Docker image hoặc repo URL</label><input class="form-control" value="ghcr.io/team/student-portal:1.2.0"></div><div class="col-md-4"><label class="form-label">Port</label><input class="form-control" value="80"></div><div class="col-md-4"><label class="form-label">Replicas</label><input class="form-control" value="3"></div><div class="col-md-4"><label class="form-label">Resource limit</label><input class="form-control" value="500m CPU / 512Mi RAM"></div><div class="col-12"><label class="form-label">Environment variables</label><textarea class="form-control">NODE_ENV=production
