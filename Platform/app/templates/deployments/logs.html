{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4">
  <div>
    <h1>Pod Logs</h1>
    {% if app %}<p class="text-muted mb-0">Runtime logs thật từ Kubernetes cho {{ app.name }}.</p>{% endif %}
  </div>
  {% if success is defined %}<span class="badge text-bg-{{ 'success' if success else 'danger' }}">{{ 'OK' if success else 'FAILED' }}</span>{% endif %}
</div>
<pre class="log-panel">{{ logs or 'Chưa lấy được log từ Kubernetes.' }}</pre>
{% endblock %}
