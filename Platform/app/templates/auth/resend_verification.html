<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gửi lại email xác minh - CICT Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 520px">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Gửi lại email xác minh</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="email" class="form-label">Email đã đăng ký</label>
        <input type="email" class="form-control" id="email" name="email"
               value="{{ email }}" required maxlength="254" autocomplete="email">
      </div>
      <button class="btn btn-primary w-100" type="submit">Gửi liên kết mới</button>
    </form>
    <div class="text-center mt-3"><a href="{{ url_for('auth.login') }}">Quay lại đăng nhập</a></div>
  </div></div>
</main>
</body>
</html>
