{% extends 'base.html' %}
{% block title %}Đổi mật khẩu - CICT Platform{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4">Đổi mật khẩu</h4>
        <form method="post">
          <div class="mb-3">
            <label for="current_password" class="form-label">Mật khẩu hiện tại</label>
            <input type="password" class="form-control" id="current_password" name="current_password" required>
          </div>
          <div class="mb-3">
            <label for="new_password" class="form-label">Mật khẩu mới</label>
            <input type="password" class="form-control" id="new_password" name="new_password" minlength="4" required>
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Xác nhận mật khẩu mới</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
          </div>
          <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary ms-2">Huỷ</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
