<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu - CICT Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; }
    .login-card { width: 100%; max-width: 420px; }
    .login-brand { text-align: center; margin-bottom: 2rem; }
    .login-brand .brand-mark { width: 56px; height: 56px; background: #4a90d9; color: #fff; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.25rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">CP</div>
      <h5 class="mb-1">CICT Platform</h5>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <h6 class="mb-3">Quên mật khẩu?</h6>
        <p class="text-muted mb-2">Đây là hệ thống nội bộ, không hỗ trợ tự động reset mật khẩu.</p>
        <p class="text-muted mb-0">Vui lòng liên hệ <strong>Admin</strong> để được cấp lại mật khẩu.</p>
      </div>
    </div>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}">&larr; Quay lại đăng nhập</a>
    </div>
  </div>
</div>
</body>
</html>
