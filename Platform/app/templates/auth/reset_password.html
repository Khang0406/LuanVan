<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu - CICT Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; }
    .login-card { width: 100%; max-width: 420px; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">Đặt lại mật khẩu</h5>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="token" value="{{ reset_token }}">
          <div class="mb-3">
            <label for="new_password" class="form-label">Mật khẩu mới</label>
            <input class="form-control" type="password" id="new_password" name="new_password" minlength="8" autocomplete="new-password" required autofocus>
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
            <input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Đặt lại mật khẩu</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
