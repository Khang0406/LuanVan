{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between align-items-center"><h1>Clusters</h1><a class="btn btn-primary" href="{{ url_for('clusters.new_cluster') }}">Tạo cluster</a></div>
<table class="table"><thead><tr><th>Tên</th><th>Status</th><th>Nodes</th><th></th></tr></thead><tbody>
{% for cluster in clusters %}<tr><td>{{ cluster.name }}</td><td>{{ cluster.status }}</td><td>{{ cluster.nodes|length }}</td><td><a href="{{ url_for('clusters.detail', cluster_id=cluster.id) }}">Chi tiết</a></td></tr>{% endfor %}
</tbody></table>
{% endblock %}
