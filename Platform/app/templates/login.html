<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Login - CICT Platform</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-4">
    <div class="card shadow-sm"><div class="card-body">
      <h3 class="mb-3">CICT Platform</h3>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
      <form method="post">
        <label class="form-label">Username</label><input class="form-control mb-2" name="username" value="admin">
        <label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" value="admin">
        <button class="btn btn-primary w-100">Đăng nhập</button>
      </form>
      <p class="text-muted small mt-3">Demo mặc định: admin/admin</p>
    </div></div>
  </div></div>
</div>
</body></html>
