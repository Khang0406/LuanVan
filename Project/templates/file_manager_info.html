{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h3 class="fw-bold mb-3">
        <i class="fas fa-info-circle"></i> Thông tin file
    </h3>

    <p class="text-muted">Đường dẫn: <code>{{ path }}</code></p>

    <table class="table table-bordered w-50 shadow-sm">
        <tr>
            <th>Kích thước</th>
            <td>{{ info.size }} bytes</td>
        </tr>
        <tr>
            <th>Quyền</th>
            <td>{{ info.permissions }}</td>
        </tr>
        <tr>
            <th>UID</th>
            <td>{{ info.uid }}</td>
        </tr>
        <tr>
            <th>GID</th>
            <td>{{ info.gid }}</td>
        </tr>
        <tr>
            <th>Lần sửa cuối</th>
            <td>{{ info.modified }}</td>
        </tr>
    </table>

    <a href="{{ url_for('file_manager', server_id=server_id, path=path.rsplit('/',1)[0] or '/') }}"
       class="btn btn-secondary mt-3">
        ⬅ Quay lại
    </a>

</div>

{% endblock %}
