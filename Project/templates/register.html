{% extends "base.html" %}
{% block content %}

<style>
  body {
    background-color: #ffffff; /* nền trắng giống trang login */
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .register-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90vh;
  }

  .register-box {
    background-color: #fff;
    padding: 40px 50px;
    border-radius: 12px;
    width: 420px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* bóng nhẹ giống login */
  }

  .register-box h3 {
    color: #343a40;
    font-weight: 700;
    text-align: center;
    margin-bottom: 25px;
  }

  .form-label {
    font-weight: 600;
    color: #555;
  }

  .form-control {
    border-radius: 6px;
    border: 1px solid #ccc;
    padding: 10px;
  }

  .btn-register {
    background-color: #6c757d; /* giống nút đăng nhập */
    border: none;
    width: 100%;
    padding: 12px;
    color: #fff;
    font-weight: 600;
    border-radius: 6px;
    transition: opacity 0.3s ease;
  }
  .btn-register:hover {
    opacity: 0.9;
  }

  .alert-danger {
    background-color: #f8d7da;
    color: #721c24;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 15px;
    text-align: center;
  }

  .register-footer {
    text-align: center;
    margin-top: 15px;
  }

  .register-footer a {
    color: #343a40;
    text-decoration: none;
    font-weight: 600;
  }
  .register-footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="register-container">
  <div class="register-box">
    <h3>Đăng ký tài khoản</h3>

    {% if error %}
      <div class="alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Tên đăng nhập</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Mật khẩu</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>

      <button type="submit" class="btn-register">Đăng ký</button>
    </form>

    <div class="register-footer">
      <p class="mt-3">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
    </div>
  </div>
</div>

{% endblock %}
