{% extends "base.html" %}
{% block content %}
<style>
    body {
        /* Đã đổi: Nền xám nhạt */
        background-color: #f4f7f6; 
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90vh;
    }

    .login-box {
        background-color: #fff;
        padding: 40px 50px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Giảm độ đậm của bóng */
        width: 400px;
    }

    .login-box h3 {
        /* Đã đổi: Màu chữ tối/đen */
        color: #343a40; 
        font-weight: 700;
        text-align: center;
        margin-bottom: 25px;
    }

    .form-control {
        border-radius: 6px;
        border: 1px solid #ced4da; /* Viền xám nhạt */
        padding: 10px;
    }

    .btn-login {
        /* Đã đổi: Màu nền xám/xanh (primary-like) */
        background-color: #6c757d; /* secondary color */
        border: none;
        width: 100%;
        padding: 12px;
        color: #fff;
        font-weight: 600;
        border-radius: 6px;
        transition: background-color 0.3s ease;
    }
    .btn-login:hover {
        /* Đã đổi: Màu hover tối hơn */
        background-color: #5a6268; 
    }

    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: none;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 15px;
        text-align: center;
    }

    .alert-danger {
        /* Đã đổi: Nền xám nhạt (đồng bộ với nền body nhưng khác màu chữ) */
        background-color: #f8f9fa; 
        /* Đã đổi: Chữ màu đỏ tiêu chuẩn (để cảnh báo vẫn nổi bật) */
        color: #dc3545; 
        border: 1px solid #f5c6cb; /* Viền đỏ nhạt */
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 15px;
        text-align: center;
    }

    .login-footer {
        text-align: center;
        margin-top: 15px;
    }

    .login-footer a {
        /* Đã đổi: Màu chữ liên kết tối */
        color: #343a40; 
        text-decoration: none;
        font-weight: 600;
    }
    .login-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-container">
    <div class="login-box">
        <h3>Đăng nhập</h3>

        {% if success %}
            <div class="alert-success">{{ success }}</div>
        {% endif %}
        {% if error %}
            <div class="alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="login-footer">
            <p class="mt-3">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
        </div>
    </div>
</div>
{% endblock %}
