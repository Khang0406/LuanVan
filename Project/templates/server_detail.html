<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chi tiết máy chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f7f7; }
        .info-box { background: white; padding: 20px; border-radius: 12px; }
        .process-table tbody tr:hover { background: #f1f1f1; }
    </style>
</head>

<body>
<div class="container py-4">

    <h2 class="fw-bold">🖥️ Máy chủ: {{ server.name }}</h2>
    <p>Địa chỉ IP: {{ server.ip }}</p>

    <hr>

    <div class="row text-center">
        <div class="col-md-4">
            <div class="info-box shadow-sm">
                <h5>CPU</h5>
                <h3 id="cpu" class="text-danger">0%</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="info-box shadow-sm">
                <h5>RAM</h5>
                <h3 id="ram" class="text-primary">0%</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="info-box shadow-sm">
                <h5>Disk</h5>
                <h3 id="disk" class="text-success">0%</h3>
            </div>
        </div>
    </div>

    <h3 class="mt-4">⚙️ Danh sách tiến trình</h3>

    <table class="table table-striped process-table">
        <thead>
            <tr>
                <th>PID</th>
                <th>Name</th>
                <th>CPU%</th>
                <th>RAM%</th>
            </tr>
        </thead>
        <tbody id="process-body"></tbody>
    </table>

</div>

<script>
function loadStatus() {
    fetch("/api/server_status/{{ server.id }}")
        .then(r => r.json())
        .then(data => {
            document.getElementById("cpu").innerText = data.cpu + "%";
            document.getElementById("ram").innerText = data.ram + "%";
            document.getElementById("disk").innerText = data.disk + "%";

            let html = "";
            data.processes.forEach(p => {
                html += `
                    <tr>
                        <td>${p.pid}</td>
                        <td>${p.name}</td>
                        <td>${p.cpu_percent}</td>
                        <td>${p.memory_percent.toFixed(1)}</td>
                    </tr>
                `;
            });
            document.getElementById("process-body").innerHTML = html;
        });
}

setInterval(loadStatus, 2000);
loadStatus();
</script>

</body>
</html>
