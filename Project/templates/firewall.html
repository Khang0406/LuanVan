{% extends "base.html" %}
{% block content %}

<div class="row">
    <div class="col-12">
        <h2 class="fw-bold mb-4 text-center text-dark">
            🔥 Firewall Management
        </h2>
    </div>
</div>

<form method="POST" class="mt-3">

    <!-- INPUT RULE -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label class="fw-bold">IP Address</label>
            <input type="text" name="ip" class="form-control" placeholder="192.168.1.1" required>
        </div>

        <div class="col-md-4">
            <label class="fw-bold">Port</label>
            <input type="number" name="port" class="form-control" placeholder="22" required>
        </div>

        <div class="col-md-4">
            <label class="fw-bold">Action</label>
            <select name="action" class="form-select">
                <option value="allow">Allow</option>
                <option value="deny">Deny</option>
            </select>
        </div>
    </div>

    <div class="mb-3 text-center">
        <button type="submit" class="btn btn-primary">
            ➕ Add Rule
        </button>
    </div>
</form>

<hr>

<!-- TABLE RULE -->
<h4>📊 Danh sách Firewall Rules</h4>

<div class="table-responsive">
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>IP</th>
                <th>Port</th>
                <th>Action</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rules %}
            <tr>
                <td>{{ r.id }}</td>
                <td>{{ r.ip }}</td>
                <td>{{ r.port }}</td>

                <td>
                    {% if r.action == "allow" %}
                        <span class="badge bg-success">ALLOW</span>
                    {% else %}
                        <span class="badge bg-danger">DENY</span>
                    {% endif %}
                </td>

                <td>{{ r.created_at }}</td>

                <td>
                    <form method="POST" action="{{ url_for('delete_firewall', rule_id=r.id) }}">
                        <button class="btn btn-danger btn-sm">
                            ❌ Delete
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
